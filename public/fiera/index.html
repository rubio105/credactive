<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>valièr — ExperienceLab 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f7f5f4;
      min-height: 100vh;
    }

    /* Header bianco con logo Valier */
    .site-header {
      background: #ffffff;
      text-align: center;
      padding: 36px 20px 28px;
      border-bottom: 1px solid #ede8e5;
    }
    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.6rem;
      font-weight: 300;
      font-style: italic;
      color: #7b1f3a;
      line-height: 1;
      letter-spacing: 1px;
    }
    .logo-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: #7b1f3a;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* Barra nav grigio scuro */
    .site-nav {
      background: #3d3d3d;
      text-align: center;
      padding: 18px 20px;
    }
    .site-nav span {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #c9a46a;
    }

    /* Area form */
    .form-wrap {
      max-width: 640px;
      margin: 44px auto;
      padding: 0 20px 80px;
    }
    .form-card {
      background: #ffffff;
      border-radius: 3px;
      padding: 40px 36px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    }

    @media (max-width: 480px) {
      .logo-text  { font-size: 2.6rem; }
      .form-card  { padding: 24px 16px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <!-- Sostituire il testo con <img src="/images/valier-logo.png" alt="valièr"> -->
    <div class="logo-text">vali&egrave;r</div>
    <div class="logo-tagline">be your priority</div>
  </header>

  <nav class="site-nav">
    <span>ExperienceLab 2026 &mdash; Registrazione Visitatori</span>
  </nav>

  <div class="form-wrap">
    <div class="form-card">

      <!-- ============================================================
           SOSTITUIRE "TUOFORMID" con l'ID del form Tally
           Esempio: se il link è tally.so/r/abc123  →  TUOFORMID = abc123
           ============================================================ -->
      <iframe
        data-tally-src="https://tally.so/embed/TUOFORMID?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        loading="lazy"
        width="100%"
        height="500"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="ExperienceLab 2026 - Registrazione">
      </iframe>
      <script>
        var d = document,
            w = "https://tally.so/widgets/embed.js",
            v = function() {
              typeof Tally !== 'undefined'
                ? Tally.loadEmbeds()
                : d.querySelectorAll('iframe[data-tally-src]:not([src])').forEach(function(e) {
                    e.src = e.dataset.tallySrc;
                  });
            };
        if (typeof Tally !== 'undefined') {
          v();
        } else if (d.querySelector('script[src="' + w + '"]') === null) {
          var s = d.createElement('script');
          s.src = w;
          s.onload = v;
          s.onerror = v;
          d.body.appendChild(s);
        }
      </script>

    </div>
  </div>

</body>
</html>
